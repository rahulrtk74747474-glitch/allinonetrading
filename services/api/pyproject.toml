[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allinonetrading-api"
version = "0.1.0"
description = "Private paper-trading research API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "httpx>=0.27"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27"
]
