name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: python -m pip install -e "services/api[test]"
      - name: Run API tests
        run: pytest services/api/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web terminal
        run: pnpm build:web
      - name: Type-check Expo Android and iOS client
        run: pnpm --filter @allinone/mobile typecheck
