name: nifty50-backtest-research

on:
  pull_request:
    branches: [main]

jobs:
  run-backtest:
    if: github.head_ref == 'research/run-nifty50-10y-backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API
        run: python -m pip install -e services/api
      - name: Run 10-year daily NIFTY 50 Vertex RSI backtest
        env:
          PYTHONPATH: services/api
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from app.backtesting.service import run_nifty50_batch

          result = run_nifty50_batch(
              timeframe='1d',
              start_date=date(2016, 9, 15),
              end_date=date(2026, 9, 15),
              total_capital=100000.0,
              rsi_length=3,
              rsi_entry_threshold=10.0,
              vertex_length=14,
              vertex_entry_threshold=-10.0,
              vertex_exit_threshold=-10.0,
              match_export=True,
              fill_mode='next_open',
              fee_bps_per_side=12.0,
              slippage_bps_per_side=3.0,
              source='yahoo',
          )
          with open('nifty50_backtest_result.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, indent=2)
          summary = {
              'verdict': result.get('verdict'),
              'verdictReasons': result.get('verdictReasons'),
              'coverage': result.get('coverage'),
              'metrics': result.get('metrics'),
              'diagnostics': result.get('diagnostics'),
              'errors': result.get('errors'),
          }
          print('BACKTEST_RESULT_START')
          print(json.dumps(summary, indent=2))
          print('BACKTEST_RESULT_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nifty50-backtest-result
          path: nifty50_backtest_result.json
