name: nifty50-1y-15m-angel-research

on:
  pull_request:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
      ANGELONE_CLIENT_ID: ${{ secrets.ANGELONE_CLIENT_ID }}
      ANGELONE_PIN: ${{ secrets.ANGELONE_PIN }}
      ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and broker dependencies
        run: |
          python -m pip install -e services/api
          python -m pip install -r services/api/requirements-broker.txt
      - name: Verify SmartAPI credentials
        shell: bash
        run: |
          missing=0
          for name in ANGELONE_API_KEY ANGELONE_CLIENT_ID ANGELONE_PIN ANGELONE_TOTP_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name: missing"
              missing=1
            else
              echo "$name: present"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Run one-year 15-minute NIFTY 50 backtest
        env:
          PYTHONPATH: services/api
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from app.backtesting.service import run_nifty50_batch
          result=run_nifty50_batch(
              timeframe='15m',
              start_date=date(2025,9,15),
              end_date=date(2026,9,15),
              total_capital=100000.0,
              rsi_length=3,
              rsi_entry_threshold=10.0,
              vertex_length=14,
              vertex_entry_threshold=-10.0,
              vertex_exit_threshold=-10.0,
              match_export=True,
              fill_mode='next_open',
              fee_bps_per_side=12.0,
              slippage_bps_per_side=3.0,
              source='angel_one',
          )
          with open('nifty50_1y_15m_result.json','w',encoding='utf-8') as f:
              json.dump(result,f,indent=2)
          summary={
              'verdict':result.get('verdict'),
              'verdictReasons':result.get('verdictReasons'),
              'coverage':result.get('coverage'),
              'metrics':result.get('metrics'),
              'diagnostics':result.get('diagnostics'),
              'errors':result.get('errors'),
          }
          print('BACKTEST_RESULT_START')
          print(json.dumps(summary,indent=2))
          print('BACKTEST_RESULT_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty50-1y-15m-result
          path: nifty50_1y_15m_result.json
